            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Atlanton';
            src: url('../Font/Atlanton-Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        #typer-box {
            font-family: 'Atlanton', sans-serif;
            width: 100%;
            height: 400px;
            font-size: 32px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>

    function buildCharacterMaps(rawString) {
        const blocks = [];
        const charMap = new Map();

        const rawBlocks = rawString.trim().split(/\n\s*\n/);

        rawBlocks.forEach((rawBlock, blockIndex) => {
            const grid = [];
            const lines = rawBlock.split('\n');
            let rowIndex = 0;

            lines.forEach(line => {
                const trimmed = line.trim();
                if (trimmed.startsWith(';') || trimmed === '') return;

                const hexCodes = trimmed.split(',');
                const row = [];

                hexCodes.forEach((hex, colIndex) => {
                    if (hex === '' || hex === 'VOID') {
                        row.push(null);
                        return;
                    }

                    const char = String.fromCodePoint(parseInt(hex, 16));
                    row.push(char);

                    charMap.set(char, { 
                        blockIndex: blockIndex, 
                        row: rowIndex, 
                        col: colIndex 
                    });
                });

                grid.push(row);
                rowIndex++;
            });
            blocks.push(grid);
        });

        return { blocks, charMap };
    }

    const { blocks, charMap } = buildCharacterMaps(csvBlocks);

    const typerBox = document.getElementById('typer-box');

    typerBox.addEventListener('keydown', function(event) {
        const arrowKeys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
        
        if (!arrowKeys.includes(event.key)) return;

        const cursorPosition = this.selectionStart;
        if (cursorPosition === 0) return;

        const textBeforeCursor = this.value.substring(0, cursorPosition);
        const textAfterCursor = this.value.substring(this.selectionEnd);

        const charsBeforeCursor = Array.from(textBeforeCursor);
        const lastChar = charsBeforeCursor[charsBeforeCursor.length - 1];

        const charInfo = charMap.get(lastChar);
        
        if (charInfo) {

            event.preventDefault();

            let { blockIndex, row, col } = charInfo;
            const grid = blocks[blockIndex];

            if (event.key === 'ArrowUp') row--;
            else if (event.key === 'ArrowDown') row++;
            else if (event.key === 'ArrowLeft') col--;
            else if (event.key === 'ArrowRight') col++;

            if (row >= 0 && row < grid.length && col >= 0 && col < grid[row].length) {
                const newChar = grid[row][col];
                
                if (newChar !== null) {
                    
                    charsBeforeCursor[charsBeforeCursor.length - 1] = newChar;
                    const newTextBeforeCursor = charsBeforeCursor.join('');
                    
                    this.value = newTextBeforeCursor + textAfterCursor;
                    
                    this.selectionStart = this.selectionEnd = newTextBeforeCursor.length;
                }
            }
        }
    });
