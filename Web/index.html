<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlanton web typer</title>
    <style>
        @font-face {
            font-family: 'Atlanton';
            src: url('../Font/Atlanton-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        @font-face {
            font-family: 'Atlanton';
            src: url('../Font/Atlanton-Italic.ttf') format('truetype');
            font-weight: normal;
            font-style: italic;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        #typer-box {
            font-family: 'Atlanton', sans-serif;
            width: 100%;
            height: 400px;
            font-size: 32px;
            padding: 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
        }
    </style>
</head>
<body>

    <h1>Atlanton web typer</h1>
    <p>Type your transcriptions below. Use your arrow keys to modify the most recently typed letter.</p>

    <textarea id="typer-box" placeholder="Start typing here..." spellcheck="false"></textarea>

</body>
</html>
